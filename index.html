<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Applied before first paint so a returning dark-mode visitor never sees a
      flash of the light theme. Must stay inline and ahead of the stylesheet.
    -->
    <script>
      try {
        var t = localStorage.getItem('sng-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* private browsing — fall through to light */
      }
    </script>

    <meta name="theme-color" content="#fdfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1613" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,0..100,0..1&family=Inter:wght@400..600&family=Noto+Serif+Gujarati:wght@400..700&display=swap"
    />

    <!--
      Splash styles are inline and self-contained on purpose: they must paint
      before the CSS bundle downloads, which is the entire point of a preloader.
      Nothing from index.css is available here.

      SMOOTHNESS RULE FOR THIS BLOCK: every animation below touches only
      `transform` and `opacity`, and every animated element is promoted to its
      own layer. Those two properties are the only ones the browser can animate
      on the compositor thread, which means the intro keeps a steady 60fps even
      while the main thread is busy parsing and mounting the React app — which
      is exactly what it is doing for most of the intro.

      The previous version animated `stroke-dashoffset` on eight SVG petals,
      rotated an SVG child element, and drove the progress ring from a JS
      requestAnimationFrame loop. All three of those force main-thread repaints
      every frame, so they stuttered badly against React's mount. Nothing here
      does that any more, and there is no per-frame JavaScript at all.
    -->
    <style>
      #splash {
        /* Keep in step with INTRO_MS in src/lib/splash.js */
        --sp-intro: 5000ms;
        --sp-bg: #fdfcfb;
        --sp-ink: #3d2f24;
        --sp-soft: #8a7563;
        --sp-brand: #e0700c;
        --sp-gold: #dfa524;
        --sp-line: rgba(61, 47, 36, 0.16);
        --sp-track: rgba(61, 47, 36, 0.1);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--sp-bg);
        font-family: Georgia, "Times New Roman", serif;
        opacity: 1;
        /* Opacity only — a composited fade that cannot jank */
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }
      html.dark #splash {
        --sp-bg: #1b1512;
        --sp-ink: #f4efe9;
        --sp-soft: #a08d7c;
        --sp-brand: #f0913a;
        --sp-gold: #f0c65a;
        --sp-line: rgba(244, 239, 233, 0.18);
        --sp-track: rgba(244, 239, 233, 0.12);
      }

      /* Warm ground wash. Opacity-only breathing: scaling a 78vmin gradient
         would re-rasterise a large texture every frame. */
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 72vmin;
        height: 72vmin;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(224, 112, 12, 0.14), transparent 68%);
        opacity: 0.75;
        will-change: opacity;
        animation: sp-glow 5s ease-in-out infinite;
      }

      .sp-stage {
        position: relative;
        width: 176px;
        height: 176px;
        display: grid;
        place-items: center;
      }

      /*
        3D orbit.

        Three hairline rings, each tilted on a different axis and precessing at a
        different rate, so they sweep in front of and behind one another and read
        as depth rather than as a flat circle spinning in place. A small bright
        head travels each of the front two, which is what makes the direction of
        travel legible.

        A tilted ring rotated about a *second* axis is the trick here: rotating a
        circle about its own axis looks static because a circle is rotationally
        symmetric, but rotateX(tilt) followed by an animated rotateY makes the
        ellipse precess, which the eye reads immediately as three dimensions.

        Compositor-only, like everything else in this file — each keyframe
        animates `transform` and nothing else, and 3D transforms are GPU work.
      */
      .sp-orbit {
        position: absolute;
        inset: -10px;
        perspective: 620px;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      .sp-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid var(--sp-line);
        transform-style: preserve-3d;
        will-change: transform;
        backface-visibility: visible;
      }
      /* The travelling head. A static box-shadow — painted once per layer, not
         animated, so it costs nothing per frame. */
      .sp-ring::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 50%;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: var(--sp-brand);
        box-shadow: 0 0 9px var(--sp-brand);
      }
      .sp-ring-1 {
        border-color: color-mix(in oklab, var(--sp-brand) 42%, transparent);
        animation: sp-orbit-1 7s linear infinite;
      }
      .sp-ring-2 {
        animation: sp-orbit-2 11s linear infinite;
      }
      .sp-ring-2::before {
        background: var(--sp-gold);
        box-shadow: 0 0 9px var(--sp-gold);
      }
      /* Furthest back, so no head — three would read as clutter */
      .sp-ring-3 {
        animation: sp-orbit-3 15s linear infinite;
      }
      .sp-ring-3::before {
        display: none;
      }

      /*
        Eight petals opening outward — a rangoli motif rather than a generic
        spinner, so the wait reads as this business and not as any website.

        Each petal is two nested elements on purpose: the outer one holds the
        static rotation into position, the inner one owns the animation. That
        keeps the animated transform a pure scaleY, which composites cleanly.
      */
      .sp-petal {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
      }
      .sp-petal i {
        width: 11px;
        height: 33px;
        margin-top: 9px;
        border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
        background: linear-gradient(to bottom, var(--sp-gold), rgba(223, 165, 36, 0));
        transform-origin: top center;
        transform: scaleY(0.14);
        opacity: 0;
        will-change: transform, opacity;
        animation: sp-bloom 2800ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .sp-logo {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        object-fit: cover;
        will-change: transform, opacity;
        animation: sp-in 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .sp-text {
        margin: 28px 0 0;
        text-align: center;
        will-change: transform, opacity;
        animation: sp-rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      .sp-name {
        margin: 0;
        font-size: clamp(1.15rem, 4.4vw, 1.5rem);
        font-weight: 700;
        color: var(--sp-ink);
      }
      .sp-gu {
        margin: 6px 0 0;
        font-size: 0.95rem;
        color: var(--sp-brand);
      }
      .sp-tag {
        margin: 12px 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.64rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sp-soft);
      }

      /*
        Progress. A single composited translateX over the intro duration, rather
        than a JS loop writing stroke-dashoffset every frame. The gradient slides
        in from the left instead of being stretched by a scaleX.
      */
      .sp-bar {
        position: relative;
        width: 150px;
        height: 3px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--sp-track);
        animation: sp-hold 1.6s ease-in-out var(--sp-intro) infinite;
      }
      .sp-bar i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--sp-gold), var(--sp-brand));
        transform: translateX(-100%);
        will-change: transform;
        animation: sp-fill var(--sp-intro) cubic-bezier(0.35, 0.05, 0.2, 1) forwards;
      }

      /* Exit: lift and fade, handing over to the page rather than blinking out */
      #splash[data-state="done"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash[data-state="done"] .sp-stage,
      #splash[data-state="done"] .sp-text,
      #splash[data-state="done"] .sp-bar {
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateY(-12px) scale(1.03);
      }

      @keyframes sp-bloom {
        0%   { transform: scaleY(0.14); opacity: 0; }
        26%  { transform: scaleY(1);    opacity: 0.95; }
        62%  { transform: scaleY(1);    opacity: 0.95; }
        88%  { transform: scaleY(0.14); opacity: 0; }
        100% { transform: scaleY(0.14); opacity: 0; }
      }
      /* Each ring keeps a fixed tilt and precesses about a second axis. */
      @keyframes sp-orbit-1 {
        from { transform: rotateX(70deg) rotateY(0deg); }
        to   { transform: rotateX(70deg) rotateY(360deg); }
      }
      @keyframes sp-orbit-2 {
        from { transform: rotateZ(32deg) rotateX(64deg) rotateY(360deg); }
        to   { transform: rotateZ(32deg) rotateX(64deg) rotateY(0deg); }
      }
      @keyframes sp-orbit-3 {
        from { transform: rotateZ(-28deg) rotateY(74deg) rotateX(0deg); }
        to   { transform: rotateZ(-28deg) rotateY(74deg) rotateX(360deg); }
      }
      @keyframes sp-glow {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }
      @keyframes sp-in {
        from { opacity: 0; transform: scale(0.76); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes sp-rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes sp-fill {
        from { transform: translateX(-100%); }
        to   { transform: translateX(0); }
      }
      /* Only visible if assets are still arriving after the bar has filled */
      @keyframes sp-hold {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }

      /* Anyone who asked for less motion still gets the mark, the name and a
         filled bar — just none of the spinning, blooming or breathing. */
      @media (prefers-reduced-motion: reduce) {
        #splash::before,
        .sp-ring,
        .sp-bar {
          animation: none;
        }
        /* Keep the tilt so it still reads as an orbit, just not moving */
        .sp-ring-1 { transform: rotateX(70deg); }
        .sp-ring-2 { transform: rotateZ(32deg) rotateX(64deg); }
        .sp-ring-3 { transform: rotateZ(-28deg) rotateY(74deg); }
        .sp-petal i {
          animation: none;
          transform: scaleY(1);
          opacity: 0.5;
        }
        .sp-logo,
        .sp-text {
          animation-duration: 0.01ms;
        }
        .sp-bar i {
          animation: none;
          transform: translateX(0);
        }
      }
    </style>

    <!-- Title, description, canonical, Open Graph, Twitter and LocalBusiness
         JSON-LD are all injected here from src/lib/site.js at build time, so
         business details exist in exactly one place. See vite.config.js. -->
    <!-- @seo -->
  </head>
  <body>
    <div id="root"></div>

    <!--
      Lives in the HTML rather than in React so it is up on the very first paint.
      A preloader that only appears once the JS bundle has downloaded would miss
      most of the wait it exists to cover. src/lib/splash.js dismisses it.
    -->
    <div id="splash" data-state="loading" role="status" aria-label="Loading Shree Nandi Gruhudhyog">
      <div class="sp-stage">
        <div class="sp-orbit">
          <span class="sp-ring sp-ring-1"></span>
          <span class="sp-ring sp-ring-2"></span>
          <span class="sp-ring sp-ring-3"></span>
        </div>
        <span class="sp-petal" style="transform: rotate(0deg)"><i style="animation-delay: 0ms"></i></span>
        <span class="sp-petal" style="transform: rotate(45deg)"><i style="animation-delay: 90ms"></i></span>
        <span class="sp-petal" style="transform: rotate(90deg)"><i style="animation-delay: 180ms"></i></span>
        <span class="sp-petal" style="transform: rotate(135deg)"><i style="animation-delay: 270ms"></i></span>
        <span class="sp-petal" style="transform: rotate(180deg)"><i style="animation-delay: 360ms"></i></span>
        <span class="sp-petal" style="transform: rotate(225deg)"><i style="animation-delay: 450ms"></i></span>
        <span class="sp-petal" style="transform: rotate(270deg)"><i style="animation-delay: 540ms"></i></span>
        <span class="sp-petal" style="transform: rotate(315deg)"><i style="animation-delay: 630ms"></i></span>
        <img class="sp-logo" src="/apple-touch-icon.png" alt="" width="76" height="76" />
      </div>

      <div class="sp-text">
        <p class="sp-name">Shree Nandi Gruhudhyog</p>
        <p class="sp-gu" lang="gu">શ્રી નંદી ગૃહ ઉદ્યોગ</p>
        <p class="sp-tag">Taste the tradition</p>
      </div>

      <div class="sp-bar"><i></i></div>
    </div>

    <script>
      /*
       * The splash needs no JavaScript to animate — the CSS above is entirely
       * self-driving. This only records when it started, so src/lib/splash.js
       * can measure the intro from first paint rather than from whenever the
       * bundle happened to finish downloading.
       */
      ;(function () {
        var el = document.getElementById('splash')
        if (!el) return

        window.__splash = { start: performance.now() }

        /*
         * Failsafe. Because the splash is baked into the HTML, a JS bundle that
         * fails to load would otherwise leave it covering the page forever. Must
         * stay comfortably above INTRO_MS in src/lib/splash.js, so it only fires
         * when something has genuinely gone wrong.
         */
        setTimeout(function () {
          if (el.isConnected && el.dataset.state !== 'done') {
            el.dataset.state = 'done'
          }
        }, 10000)
      })()
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
