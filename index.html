    <!--
      Applied before first paint so a returning dark-mode visitor never sees a
      flash of the light theme. Must stay inline and ahead of the stylesheet.
    -->
    <script>
      try {
        var t = localStorage.getItem('sng-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* private browsing — fall through to light */
      }
    </script>
